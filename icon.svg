<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">NIM: a 1-3-5-7 Nim board of buttons and LEDs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a24"/>
      <stop offset="1" stop-color="#0e1411"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd2c8"/>
      <stop offset="0.35" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#b3200b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="off" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5a3a34"/>
      <stop offset="1" stop-color="#2a1a17"/>
    </radialGradient>
    <g id="on">
      <circle r="34" fill="url(#glow)"/>
      <circle r="19" fill="url(#lit)"/>
    </g>
    <g id="dark">
      <circle r="19" fill="url(#off)" stroke="#3d2925" stroke-width="2"/>
    </g>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#3f8a3a" stroke-width="6" opacity="0.6"/>

  <!-- PCB traces -->
  <g stroke="#3f8a3a" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M64 122 H448"/>
    <path d="M64 202 H448"/>
    <path d="M64 282 H448"/>
    <path d="M64 362 H448"/>
  </g>

  <!-- Heap 1 -->
  <use href="#on" x="256" y="122"/>
  <!-- Heap 2 -->
  <use href="#on" x="196" y="202"/>
  <use href="#on" x="256" y="202"/>
  <use href="#dark" x="316" y="202"/>
  <!-- Heap 3 -->
  <use href="#on" x="136" y="282"/>
  <use href="#on" x="196" y="282"/>
  <use href="#on" x="256" y="282"/>
  <use href="#on" x="316" y="282"/>
  <use href="#dark" x="376" y="282"/>
  <!-- Heap 4 -->
  <use href="#on" x="76" y="362"/>
  <use href="#on" x="136" y="362"/>
  <use href="#on" x="196" y="362"/>
  <use href="#dark" x="256" y="362"/>
  <use href="#dark" x="316" y="362"/>
  <use href="#dark" x="376" y="362"/>
  <use href="#dark" x="436" y="362"/>

  <text x="256" y="452" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="44" font-weight="700" letter-spacing="14" fill="#7fd36f">NIM</text>
</svg>
