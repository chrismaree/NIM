[platformio]
src_dir = src
default_envs = uart

; Serial on UART0: the board's "UART" USB port, and Wokwi.
[env:uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Serial on native USB: the board's "USB" port. Hangs in Wokwi, so use it on
; real hardware only.
[env:usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
